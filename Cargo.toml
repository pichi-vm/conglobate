[package]
name = "conglobate"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pichi-vm/conglobate"
publish = false
description = "Standalone image builder with isolated command execution"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
