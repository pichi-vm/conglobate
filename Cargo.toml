[package]
name = "conglobate"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pichi-vm/conglobate"
publish = false
description = "Standalone privileged image builder for pichi."

[dependencies]
carapace = { git = "https://github.com/pichi-vm/carapace", rev = "184c28879cb3cdeadb7bdd82f1b0dae63df6f079", version = "0.1.0", default-features = false, features = ["loop", "image"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
devmap-core = { git = "https://github.com/pichi-vm/devmap.git", rev = "b4bf66ac9dea45f79c5f672b642abe4da1ab6870", version = "0.1.0" }
devmap-linux = { git = "https://github.com/pichi-vm/devmap.git", rev = "b4bf66ac9dea45f79c5f672b642abe4da1ab6870", version = "0.1.0" }
devmap-snapshot = { git = "https://github.com/pichi-vm/devmap.git", rev = "b4bf66ac9dea45f79c5f672b642abe4da1ab6870", version = "0.1.0" }
devmap-verity = { git = "https://github.com/pichi-vm/devmap.git", rev = "b4bf66ac9dea45f79c5f672b642abe4da1ab6870", version = "0.1.0", features = ["sha2"] }
devtree = { git = "https://github.com/pichi-vm/devtree", rev = "e90bafce9ee9e4f7f570f07c5c242b6398c64980", features = ["alloc"] }
filetime = "0.2"
gix = { version = "0.84", default-features = false, features = ["sha1", "sha256"] }
goblin = { version = "0.10", default-features = false, features = ["std", "pe32", "pe64"] }
hex = "0.4"
lodown = { git = "https://github.com/pichi-vm/lodown.git", rev = "31f8951293af180150e5e4c654c47a5b190097b9", version = "0.1.0" }
nix = { version = "0.30", features = ["mount", "sched", "fs", "user", "process", "signal"] }
pichi-artifact = { git = "https://github.com/pichi-vm/pichi-artifact", rev = "64feac956d4539fb79b9490a90480a81ef098ebb", version = "0.1.0" }
pmi = { git = "https://github.com/pichi-vm/pmi", rev = "364ee0be240fa44c9d7cef7692593f3b52e45b78", version = "0.1.0" }
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
xattr = "1"
zstd = "0.13"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
type_complexity = "allow"
similar_names = "allow"
struct_field_names = "allow"
needless_continue = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
too_many_lines = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
uninlined_format_args = "allow"
