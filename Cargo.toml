[package]
name = "conglobate"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pichi-vm/conglobate"
publish = false
description = "Standalone image builder with isolated command execution"

[workspace]

[features]
default = []
yaml = ["dep:serde-saphyr"]
# Runtime dependencies are enabled only when building the CLI.
cli = [
    "yaml",
    "dep:serde_json",
    "dep:sha2",
    "dep:getrandom",
    "dep:crc",
    "dep:uuid",
    "dep:zerocopy",
    "dep:ruzstd",
    "dep:zstd",
    "dep:anyhow",
    "dep:netlink-packet-core",
    "dep:netlink-packet-route",
    "dep:seccompiler",
    "dep:linux-raw-sys",
    "dep:nix",
    "dep:rustix",
    "dep:ciborium",
    "dep:serde_bytes",
    "dep:tempfile",
    "dep:gix",
    "dep:clap",
    "dep:lodown",
    "dep:devmap-snapshot",
    "dep:devmap-linux",
    "dep:devmap-core",
    "dep:devmap-verity",
    "dep:carapace",
]

[lib]
name = "conglobate"
path = "src/lib.rs"

[[bin]]
name = "conglobate"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
humantime-serde = "1.1"
# --- types-only lib surface (always on) ---
thiserror = "2"
serde = { version = "1", features = ["derive"] }
hex = "0.4"

# --- binary runtime (bins require `cli`) ---
serde-saphyr = { version = "2.1", optional = true, default-features = false, features = ["deserialize"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
getrandom = { version = "0.4", optional = true }
crc = { version = "3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
zerocopy = { version = "0.8", features = ["derive"], optional = true }
ruzstd = { version = "0.9.1", optional = true }
zstd = { version = "0.13.4", optional = true, default-features = false }
anyhow = { version = "1", optional = true }
netlink-packet-core = { version = "=0.9.0", optional = true }
netlink-packet-route = { version = "=0.33.0", optional = true }
seccompiler = { version = "=0.5.0", optional = true }
linux-raw-sys = { version = "=0.12.1", features = ["general"], optional = true }
nix = { version = "0.31", optional = true, default-features = false, features = ["sched", "process"] }
# Safe borrowed-descriptor mount_setattr API (upstream PR 1630); qualification
# and the reason for this unreleased revision are recorded in DESIGN.md.
rustix = { git = "https://github.com/bytecodealliance/rustix", rev = "8bda151df87574f56f1e4c0b59f2d1df5d61609e", version = "1", optional = true, features = ["fs", "mount", "process", "event", "net", "stdio", "thread", "time"] }
ciborium = { version = "0.2.2", optional = true }
serde_bytes = { version = "0.11", optional = true }
tempfile = { version = "3", optional = true }
gix = { version = "0.84", optional = true, default-features = false, features = ["sha1", "sha256"] }
clap = { version = "4", optional = true, features = ["derive"] }

lodown = { git = "https://github.com/pichi-vm/lodown.git", branch = "main", version = "0.1.0", optional = true }
carapace = { git = "https://github.com/pichi-vm/carapace", branch = "main", optional = true, default-features = false, features = ["loop"] }
devmap-snapshot = { git = "https://github.com/pichi-vm/devmap.git", branch = "main", version = "0.1.0", optional = true }
devmap-linux = { git = "https://github.com/pichi-vm/devmap.git", branch = "main", version = "0.1.0", optional = true }
devmap-core = { git = "https://github.com/pichi-vm/devmap.git", branch = "main", version = "0.1.0", optional = true }
devmap-verity = { git = "https://github.com/pichi-vm/devmap.git", branch = "main", version = "0.1.0", optional = true, features = ["sha2"] }

[dev-dependencies]
# Independent GPT fixtures.
gpt = "4.1"
ciborium = "0.2.2"
serde_json = "1"
sha2 = "0.11"
# Verify the formatter's captured runtime includes its exact PT_INTERP path.
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "endian_fd"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
self_named_module_files = "deny"
all = { level = "warn", priority = -1 }
