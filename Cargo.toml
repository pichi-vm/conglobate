[package]
name = "conglobate"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pichi-vm/conglobate"
publish = false
description = "Standalone image builder with isolated command execution"

[dependencies]
thiserror = "2"
seccompiler = "=0.5.0"
linux-raw-sys = { version = "=0.12.1", features = ["general"] }
libbpf-rs = "0.27.2"
minicbor = { version = "2.3.1", features = ["std"] }
nix = { version = "0.31", default-features = false, features = ["sched", "process"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
hex = "0.4"
sha2 = "0.11"
rustix = { git = "https://github.com/bytecodealliance/rustix", rev = "8bda151df87574f56f1e4c0b59f2d1df5d61609e", version = "1", features = ["fs", "mount", "process", "event", "net", "stdio", "thread"] }
pichi-artifact = { git = "https://github.com/pichi-vm/pichi-artifact", rev = "64feac956d4539fb79b9490a90480a81ef098ebb", version = "0.1.0" }
serde_json = "1"
regex = "1"
zstd = "0.13"
tempfile = "3"
gix = { version = "0.84", default-features = false, features = ["sha1", "sha256"] }
clap = { version = "4", features = ["derive"] }

lodown = { git = "https://github.com/pichi-vm/lodown.git", rev = "31f8951293af180150e5e4c654c47a5b190097b9", version = "0.1.0" }
devmap-linux = { git = "https://github.com/pichi-vm/devmap.git", rev = "2679426fa1d4508fc5c3bbdf643efbdbe64a3edd", version = "0.1.0" }
devmap-core = { git = "https://github.com/pichi-vm/devmap.git", rev = "2679426fa1d4508fc5c3bbdf643efbdbe64a3edd", version = "0.1.0" }
devmap-verity = { git = "https://github.com/pichi-vm/devmap.git", rev = "2679426fa1d4508fc5c3bbdf643efbdbe64a3edd", version = "0.1.0", features = ["sha2"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"

[build-dependencies]
libbpf-cargo = "0.27.2"
