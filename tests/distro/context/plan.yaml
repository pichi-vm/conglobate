# Offline CLI regression: COPY consumes committed context bytes without exposing
# a checkout to commands. Run using the maintained distro runner and Fedora seed.
version: 1
stages:
  rootfs:
    extend: qualification.local/fedora:43
    steps:
    - copy:
        path: message.txt
        into: /etc/conglobate-context-check
    - exec:
        command: |
          test -z "${CARAPACE+x}"
          test "$(cat /etc/conglobate-context-check)" = 'committed context bytes'
          test ! -e /context
          test ! -e /build-context
          printf 'COMMITTED_CONTEXT_COPY_PASS\n'
image: rootfs
