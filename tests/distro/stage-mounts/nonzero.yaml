stages:
  rootfs:
    use: qualification.local/fedora:43
    format: {fs: ext4, size: 32MiB, esp: 257MiB}
    mounts: {/boot/efi: esp, /tmp: tmpfs, /tmp/nested: tmpfs}
    steps:
    - exec:
        command: |
          printf 'discarded\n' > /mnt/boot/efi/marker
          printf 'temporary\n' > /mnt/tmp/nested/marker
          printf 'STAGE_MOUNTS_EXPECTED_FAILURE\n'
          exit 7
    - exec:
        command: printf 'STAGE_UNEXPECTED_CONTINUATION\n'
image: rootfs
