tasks:
  rootfs:
    kind: bootstrap
    from: qualification.local/fedora:43
    filesystem: {kind: ext4, size: 32MiB, esp: 257MiB}
    mount: {/boot/efi: esp, /tmp: tmpfs, /tmp/nested: tmpfs}
    exec:
    - run: |
        printf 'discarded\n' > /mnt/boot/efi/marker
        printf 'temporary\n' > /mnt/tmp/nested/marker
        printf 'STAGE_MOUNTS_TIMEOUT_STARTED\n'
        while :; do :; done
      timeout: 2s
    - run: printf 'STAGE_UNEXPECTED_CONTINUATION\n'
image: rootfs
