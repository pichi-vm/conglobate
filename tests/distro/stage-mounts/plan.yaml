# Disposable-VM check of stage filesystem ownership across commands and COPY.
stages:
  base:
    use: qualification.local/fedora:43
    format: {fs: ext4, size: 64MiB, esp: 257MiB}
    mounts:
      /boot/efi: esp
      /tmp: tmpfs
      /tmp/nested: tmpfs
    steps:
    - exec:
        command: |
          mkdir -p /mnt/bin /mnt/etc /mnt/dev /mnt/proc /mnt/sys /mnt/run
          for tool in sh cat mkdir mv; do cp -L /bin/$tool /mnt/bin/$tool; done
          libraries=$(ldd /bin/sh /bin/cat /bin/mkdir /bin/mv)
          for library in $libraries; do
            case "$library" in
              /*:) ;;
              /*) cp -L --parents "$library" /mnt ;;
            esac
          done
          printf 'base\n' > /mnt/boot/efi/marker
          printf 'temporary\n' > /mnt/tmp/first
          printf 'nested\n' > /mnt/tmp/nested/first
          printf 'STAGE_CREATION_MOUNTS_PASS\n'
    - copy: {path: message.txt, into: /mnt/tmp/copied}
    - copy: {path: message.txt, into: /mnt/boot/efi/copied}
    - exec:
        command: |
          test "$(cat /mnt/tmp/copied)" = 'copied into stage tmpfs'
          test "$(cat /mnt/boot/efi/copied)" = 'copied into stage tmpfs'
          test "$(cat /mnt/tmp/first)" = temporary
          test "$(cat /mnt/tmp/nested/first)" = nested
          mv /mnt/boot /mnt/relocated
          test "$(cat /mnt/relocated/efi/marker)" = base
          printf 'STAGE_NESTED_COPY_AND_RENAME_PASS\n'
  extended:
    extend: base
    mounts: {/boot/efi: esp, /tmp: tmpfs}
    steps:
    - exec:
        command: |
          test ! -e /tmp/first
          test ! -e /tmp/copied
          test "$(cat /boot/efi/marker)" = base
          test "$(cat /boot/efi/copied)" = 'copied into stage tmpfs'
          printf 'extended\n' > /boot/efi/marker
          printf 'temporary extension\n' > /tmp/first
    - copy: {path: message.txt, into: /tmp/copied}
    - exec:
        command: |
          test "$(cat /tmp/first)" = 'temporary extension'
          test "$(cat /tmp/copied)" = 'copied into stage tmpfs'
          printf 'STAGE_EXTENSION_MOUNTS_PASS\n'
  persisted:
    extend: extended
    mounts: {/boot/efi: esp}
    steps:
    - exec:
        command: |
          test "$(cat /boot/efi/marker)" = extended
          test ! -e /tmp/first
          test ! -e /tmp/copied
          printf 'STAGE_ESP_PERSISTS_TMPFS_DISAPPEARS_PASS\n'
  output:
    extend: persisted
    steps:
    - copy: {from: base, path: /tmp, into: /source-tmp}
    - copy: {from: persisted, path: /boot/efi, into: /source-efi}
    - exec:
        command: |
          test ! -e /source-tmp/first
          test ! -e /source-tmp/copied
          test ! -e /source-tmp/nested/first
          test ! -e /source-efi/marker
          printf 'STAGE_COPY_READS_PERSISTED_ROOT_PASS\n'
          test ! -e /boot/efi/marker
          test ! -e /relocated/efi/marker
          test ! -e /tmp/first
          printf 'STAGE_MOUNTS_NOT_INHERITED_PASS\n'
image: output
