stages:
  bootstrap:
    using: qualification.local/fedora:43
    format:
      size: 1GiB
      kind: ext4
      label: alpine-root
    derive:
    - network: true
      timeout: 10m
      exec: dnf -y install tar gzip
    - copy:
        path: alpine-minirootfs.tar.gz
        into: /alpine-minirootfs.tar.gz
    - exec: |
        echo 'c5ca053cfe1d85c5b96dff8b9bc57045f7f184a30ffb6b65776409ca90388677  /alpine-minirootfs.tar.gz' | sha256sum -c -
        tar --numeric-owner -xzf /alpine-minirootfs.tar.gz -C /mnt
  rootfs:
    extending: bootstrap
    derive:
    - network: true
      timeout: 10m
      exec: |
        apk update
        apk add alpine-base
        apk info -e alpine-base openrc
        printf 'conglobate Alpine qualification\n' > /etc/conglobate-qualified
        printf 'alpine\n' > /etc/hostname
        # The immutable corium root needs volatile writable state at boot.
        printf 'tmpfs /var tmpfs defaults 0 0\ntmpfs /tmp tmpfs defaults,mode=1777 0 0\n' > /etc/fstab
        rc-update add devfs sysinit
        rc-update add procfs sysinit
        rc-update add sysfs sysinit
        rc-update add mdev sysinit
        rc-update add hostname boot
        rc-update add bootmisc boot
        rc-update add localmount boot
        rc-update add local default
    - copy:
        path: qualification.start
        into: /etc/local.d/conglobate-qualification.start
    - exec: chmod 0755 /etc/local.d/conglobate-qualification.start
  firmware:
    extending: qualification.local/fedora:43
    derive:
    - copy:
        path: firmware
        into: /plan-input-firmware
    - exec: cp -a /plan-input-firmware/boot.pmi /qualification-boot.pmi
image:
  root: rootfs
  boot: {from: firmware, path: /qualification-boot.pmi}
  bootconfig:
    values:
      corium.root: ""
      kernel.console: [ttyS0, hvc0]
