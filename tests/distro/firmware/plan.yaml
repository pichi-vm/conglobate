version: 1
stages:
  rootfs:
    extend: qualification.local/fedora:43
    steps:
    - copy:
        path: qualification.sh
        into: /usr/local/bin/conglobate-qualification
    - exec:
        command: chmod 0755 /usr/local/bin/conglobate-qualification
    - copy:
        path: qualification.service
        into: /etc/systemd/system/conglobate-qualification.service
    - exec:
        command: |
          mkdir -p /etc/systemd/system/multi-user.target.wants
          ln -s ../conglobate-qualification.service /etc/systemd/system/multi-user.target.wants/conglobate-qualification.service
  firmware:
    extend: qualification.local/fedora:43
    steps:
    - exec:
        command: dnf -y install tar cpio findutils
        network: true
        timeout: 10m
    - copy:
        path: arma
        into: /arma
    - exec:
        command: chmod 0755 /arma
    - copy:
        path: vmlinuz
        into: /vmlinuz
    - copy:
        path: kernel.config
        into: /kernel.config
    - copy:
        path: initrd-files.tar
        into: /initrd-files.tar
    - exec:
        command: |
          mkdir /initrd
          tar -xf /initrd-files.tar -C /initrd
          (cd /initrd; find . -print0 | cpio --null --create --format=newc --quiet) > /initrd.cpio
          /arma build --kernel /vmlinuz --config /kernel.config --initrd /initrd.cpio --cmdline bootconfig --dtb attached /boot.pmi
image:
  root: rootfs
  boot:
    extract: {from: firmware, path: /boot.pmi}
    define:
      corium.root: ""
      kernel.console: [ttyS0, hvc0]
      kernel.systemd.volatile: state
      kernel.systemd.unit: multi-user.target
