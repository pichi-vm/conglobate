stages:
  bootstrap:
    using: qualification.local/fedora:43
    format:
      size: 64MiB
      kind: ext4
    derive:
    - exec: |
        printf 'tool-write\n' > /bootstrap-tool-write
        printf 'output-write\n' > /mnt/bootstrap-output-write
        test "$(cat /bootstrap-tool-write)" = tool-write
        test "$(cat /mnt/bootstrap-output-write)" = output-write
        printf 'BOOTSTRAP_BOTH_ROOTS_WRITTEN\n'
        exit 7
    - exec: printf 'BOOTSTRAP_REJECTED_STEP_RAN\n'
image: bootstrap
