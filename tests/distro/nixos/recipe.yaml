tasks:
  bootstrap:
    kind: bootstrap
    from: qualification.local/fedora:43
    filesystem:
      size: 4GiB
      kind: ext4
      label: nixos-root
    exec:
    - network: true
      timeout: 10m
      run: dnf -y install tar xz gzip
    - copy:
        from: nix.tar.xz
        into: /nix.tar.xz
    - copy:
        from: nixpkgs.tar.xz
        into: /nixpkgs.tar.xz
    - copy:
        from: configuration.nix
        into: /configuration.nix
    - copy:
        from: build.sh
        into: /build.sh
    - network: true
      timeout: 30m
      run: /bin/sh /build.sh
  rootfs:
    kind: extend
    from: bootstrap
    exec:
    - run: |
        printf 'conglobate NixOS qualification\n' > /conglobate-qualified
        chown 1234:2345 /conglobate-qualified
    - copy:
        from: init.sh
        into: /sbin/init
    - run: chmod 0755 /sbin/init
  firmware:
    kind: build
    from: qualification.local/fedora:43
    exec:
    - copy:
        from: firmware
        into: /recipe-input-firmware
    - run: cp -a /recipe-input-firmware/boot.pmi /qualification-boot.pmi
    - copy:
        from: firmware
        into: /recipe-input-firmware
    - run: cp -a /recipe-input-firmware/base.dtb /qualification-base.dtb
    into:
      pmi: /qualification-boot.pmi
      dtb: /qualification-base.dtb
image:
  root: rootfs
  boot: firmware
