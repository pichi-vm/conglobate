# SPDX-License-Identifier: Apache-2.0
stages:
  bootstrap:
    using: qualification.local/fedora:43
    format:
      size: 4GiB
      kind: ext4
      label: nixos-root
    derive:
    - network: true
      timeout: 10m
      exec: dnf -y install tar xz gzip
    - copy:
        path: nix.tar.xz
        into: /nix.tar.xz
    - copy:
        path: nixpkgs.tar.xz
        into: /nixpkgs.tar.xz
    - copy:
        path: configuration.nix
        into: /configuration.nix
    - copy:
        path: build.sh
        into: /build.sh
    - network: true
      timeout: 30m
      exec: /bin/sh /build.sh
  rootfs:
    extending: bootstrap
    derive:
    - exec: |
        printf 'conglobate NixOS qualification\n' > /conglobate-qualified
        chown 1234:2345 /conglobate-qualified
    - copy:
        path: init.sh
        into: /sbin/init
    - exec: chmod 0755 /sbin/init
  firmware:
    extending: qualification.local/fedora:43
    derive:
    - copy:
        path: firmware
        into: /plan-input-firmware
    - exec: cp -a /plan-input-firmware/boot.pmi /qualification-boot.pmi
image:
  root: rootfs
  boot: {from: firmware, path: /qualification-boot.pmi}
  bootconfig:
    values:
      corium.root: ""
      kernel.console: [ttyS0, hvc0]
