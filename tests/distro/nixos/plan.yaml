# SPDX-License-Identifier: Apache-2.0
stages:
  bootstrap:
    use: qualification.local/fedora:43
    format:
      size: 4GiB
      fs: ext4
      label: nixos-root
    steps:
    - exec:
        command: dnf -y install tar xz gzip
        network: true
        timeout: 10m
    - copy:
        path: nix.tar.xz
        into: /nix.tar.xz
    - copy:
        path: nixpkgs.tar.xz
        into: /nixpkgs.tar.xz
    - copy:
        path: configuration.nix
        into: /configuration.nix
    - copy:
        path: build.sh
        into: /build.sh
    - exec:
        command: /bin/sh /build.sh
        network: true
        timeout: 30m
  rootfs:
    extend: bootstrap
    steps:
    - exec:
        command: |
          printf 'conglobate NixOS qualification\n' > /conglobate-qualified
          chown 1234:2345 /conglobate-qualified
    - copy:
        path: init.sh
        into: /sbin/init
    - exec:
        command: chmod 0755 /sbin/init
  firmware:
    extend: qualification.local/fedora:43
    steps:
    - copy:
        path: firmware
        into: /plan-input-firmware
    - exec:
        command: cp -a /plan-input-firmware/boot.pmi /qualification-boot.pmi
image:
  root: rootfs
  boot:
    extract: {from: firmware, path: /qualification-boot.pmi}
    define:
      corium.root: ""
      kernel.console: [ttyS0, hvc0]
