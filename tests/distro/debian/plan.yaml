# SPDX-License-Identifier: Apache-2.0
stages:
  rootfs:
    extending: qualification.local/debian:trixie
    derive:
    - network: true
      timeout: 20m
      exec: |
        printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
        chmod 0755 /usr/sbin/policy-rc.d
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y systemd-sysv udev dbus util-linux
        dpkg-query -W systemd-sysv udev dbus util-linux
        rm /usr/sbin/policy-rc.d
        printf 'conglobate Debian qualification\n' > /etc/conglobate-qualified
        printf 'debian\n' > /etc/hostname
        truncate -s 0 /etc/machine-id
        # The inherited firmware boots with systemd.volatile=state. Preserve
        # Debian's package database so tmpfiles can seed the fresh /var.
        mkdir -p /usr/share/factory/var/lib /usr/lib/tmpfiles.d
        cp -a /var/lib/dpkg /usr/share/factory/var/lib/dpkg
        printf 'C /var/lib/dpkg - - - -\n' > /usr/lib/tmpfiles.d/conglobate-dpkg.conf
    - copy:
        path: qualification.service
        into: /etc/systemd/system/conglobate-qualification.service
    - copy:
        path: qualification.sh
        into: /usr/local/bin/conglobate-qualification
    - exec: chmod 0755 /usr/local/bin/conglobate-qualification
    - exec: |
        mkdir -p /etc/systemd/system/multi-user.target.wants
        ln -s ../conglobate-qualification.service /etc/systemd/system/multi-user.target.wants/conglobate-qualification.service
  firmware:
    extending: rootfs
    derive:
    - copy:
        path: firmware
        into: /plan-input-firmware
    - exec: cp -a /plan-input-firmware/boot.pmi /qualification-boot.pmi
image:
  root: rootfs
  boot: {from: firmware, path: /qualification-boot.pmi}
  bootconfig:
    values:
      corium.root: ""
      kernel.console: [ttyS0, hvc0]
      kernel.systemd.volatile: state
      kernel.systemd.unit: multi-user.target
