# Minimal two-root lifecycle regression; not a bootable distro qualification.
tasks:
  bootstrap:
    kind: bootstrap
    from: qualification.local/fedora:43
    filesystem:
      size: 64MiB
      kind: ext4
      label: label-probe
    exec:
    - run: |
        test ! -e /build-context
        printf 'tool-only\n' > /conglobate-tool-marker
        printf 'bootstrap-output\n' > /mnt/output-marker
        chown 123:456 /mnt/output-marker
        chmod 0640 /mnt/output-marker
        test "$(stat -c '%u:%g:%a' /mnt/output-marker)" = '123:456:640'
        printf 'BOOTSTRAP_TWO_ROOTS_FIRST_STEP_PASS\n'
    - run: |
        test "$(cat /conglobate-tool-marker)" = tool-only
        test "$(cat /mnt/output-marker)" = bootstrap-output
        test "$(stat -c '%u:%g:%a' /mnt/output-marker)" = '123:456:640'
        test ! -e /mnt/conglobate-tool-marker
        printf 'BOOTSTRAP_TWO_ROOTS_REMOUNT_PASS\n'
image: bootstrap
