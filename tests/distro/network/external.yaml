version: 1
stages:
  rootfs:
    extend: qualification.local/fedora:43
    steps:
    - copy:
        path: external-endpoint
        into: /external-endpoint
    - exec:
        command: |
          /bin/bash -eu -c '
            read -r port token < /external-endpoint
            exec 3<>/dev/tcp/10.0.2.2/$port
            printf "%s\n" "$token" >&3
            IFS= read -r response <&3
            test "$response" = external-reply
            exec 3>&-
          '
          rm /external-endpoint
          printf 'NETWORK_EXTERNAL_TCP_REPLY_PASS\n'
        network: true
        timeout: 30s
image: rootfs
