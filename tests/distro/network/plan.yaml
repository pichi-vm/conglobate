stages:
  rootfs:
    extending: qualification.local/fedora:43
    derive:
    - exec: |
        mkdir -p /run/conglobate-resolver
        rm -f /etc/resolv.conf
        ln -s /run/conglobate-resolver/config /etc/resolv.conf
        printf 'nameserver 192.0.2.123\n' > /run/conglobate-resolver/config
    - exec: |
        if printf 'invalid\n' >> /etc/resolv.conf; then
          echo 'resolver unexpectedly writable' >&2
          exit 1
        fi
        /bin/bash -eu -c '
          exec 3<>/dev/tcp/build.fixture/45457
          printf "request\n" >&3
          IFS= read -r response <&3
          test "$response" = reply
          exec 3>&-
        '
        printf 'NETWORK_PLAN_DNS_TCP_AND_READONLY_RESOLVER_PASS\n'
        readlink /proc/self/ns/net > /run/network-identity
        checked=0
        while read -r name value rest; do
          case "$name" in
            CapInh:|CapPrm:|CapEff:|CapBnd:|CapAmb:)
              test "$((0x$value & ((1 << 12) | (1 << 13) | (1 << 21))))" = 0
              checked=$((checked + 1))
              ;;
          esac
        done < /proc/self/status
        test "$checked" = 5
        printf 'NETWORK_COMMAND_CAPABILITIES_RESTRICTED_PASS\n'
      network: true
      timeout: 30s
    - exec: |
        test "$(readlink /proc/self/ns/net)" = "$(cat /run/network-identity)"
        printf 'NETWORK_ENABLED_STEPS_REUSE_NAMESPACE_PASS\n'
      network: true
      timeout: 30s
    - exec: |
        test "$(readlink /proc/self/ns/net)" != "$(cat /run/network-identity)"
        test "$(wc -l < /proc/net/route)" = 1
        test "$(grep -c : /proc/net/dev)" = 1
        grep -q "lo:" /proc/net/dev
        test -L /etc/resolv.conf
        test "$(readlink /etc/resolv.conf)" = /run/conglobate-resolver/config
        test "$(cat /run/conglobate-resolver/config)" = 'nameserver 192.0.2.123'
        printf 'NETWORK_RESOLVER_SYMLINK_AND_CONTENT_RESTORED_PASS\n'
        printf 'NETWORK_FOLLOWING_OFFLINE_STEP_PASS\n'
image: rootfs
