# Supply a PMI and DTB without a corium binding: this image has no root.
# A local carapace used only as tools must not define CARAPACE.
tasks:
  tools:
    kind: extend
    from: qualification.local/fedora:43
  boot:
    kind: build
    from: tools
    exec:
      - run: |
          test -z "${CARAPACE+x}"
          printf 'BOOT_ONLY_CARAPACE_UNDEFINED_PASS\n'
      - copy: {from: firmware, into: /boot-input}
    into: {pmi: /boot-input/boot.pmi, dtb: /boot-input/base.dtb}
image: boot
