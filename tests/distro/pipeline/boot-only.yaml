# Extract a PMI without bootconfig: this image has no root.
# A local carapace used only as tools must not define CARAPACE.
stages:
  boot:
    extending: qualification.local/fedora:43
    derive:
      - exec: |
          test -z "${CARAPACE+x}"
          printf 'BOOT_ONLY_CARAPACE_UNDEFINED_PASS\n'
      - copy: {path: firmware, into: /boot-input}
image:
  boot: {from: boot, path: /boot-input/boot.pmi}
