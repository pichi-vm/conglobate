# cargo-deny configuration for conglobate.
#
# The license allowlist is tailored to conglobate's actual dependency tree
# (verify with `cargo metadata`). Adding a dependency whose license is not
# listed here fails CI by design — a deliberate prompt to review the new
# license before accepting it.

[graph]
# Check the program's dependencies too; they sit behind the `cli` feature.
all-features = true

[licenses]
allow = [
    "Apache-2.0",   # this crate + many deps
    "BSD-2-Clause", # libbpf BSD option and libbpf-sys
    "BlueOak-1.0.0", # minicbor
    "BSD-3-Clause", # encoding_rs WHATWG encoding data
    "Zlib",         # foldhash (gix pack cache)
    "MIT",          # many deps (dual MIT/Apache)
    "Unicode-3.0",  # required by the `unicode-ident` family (AND expression)
]
confidence-threshold = 0.8

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Allow ecosystem path/git dependencies without a registry version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Safe mount_setattr API; pinned and qualified in DESIGN.md.
allow-git = ["https://github.com/bytecodealliance/rustix"]
[sources.allow-org]
github = ["pichi-vm"]   # ecosystem dependencies
