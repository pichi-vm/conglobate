#
# Network smoke test for the build-appliance image. Build the image with
# image/build.sh, then from the repository root:
#
#   pichi build -b conglobate:0.2.0 --ref HEAD --context image/smoke .
#
# The `network: true` step must run in the image's build network
# namespace (only loopback and pichi-build, default route through the
# VM's NAT at 192.168.250.1), resolve a name with the resolver file the
# image supplies, and fetch a page over HTTPS. The step after it must
# be offline again.

tasks:
  network:
    kind: extend
    from: ghcr.io/pichi-vm/fedora:43
    exec:
    - network: true
      timeout: 5m
      run: |
        set -eu
        # Not the VM's own namespace: no virtio-net card, only lo and the
        # build end of the veth pair.
        grep -q '^ *lo:' /proc/net/dev
        grep -q '^ *pichi-build:' /proc/net/dev
        test "$(grep -c : /proc/net/dev)" = 2
        # Default route via 192.168.250.1 (little-endian hex in /proc).
        grep -Eq '^pichi-build[[:space:]]+00000000[[:space:]]+01FAA8C0[[:space:]]' /proc/net/route
        grep -q '^nameserver 10.0.2.3$' /etc/resolv.conf
        getent hosts fedoraproject.org
        curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' https://fedoraproject.org/
        readlink /proc/self/ns/net > /network-smoke-netns
        printf 'NETWORK_SMOKE_PASS\n'
    - run: |
        set -eu
        test "$(readlink /proc/self/ns/net)" != "$(cat /network-smoke-netns)"
        test "$(grep -c : /proc/net/dev)" = 1
        rm /network-smoke-netns
        printf 'NETWORK_SMOKE_OFFLINE_PASS\n'
image: network
