#
# Fedora 43 rootfs from packages (mkosi), not a layer on the fedora carapace.
# No RemoveFiles: stock fedora prunes modules this appliance must keep.
# kernel-modules is the virtiofs(+fuse) keep. Those modules stay in the
# carapace tree and are loaded after pivot; they are not initramfs pivot mods.
# e2fsprogs supplies image-resident mke2fs. systemd-networkd (a separate
# package on Fedora) brings up the VM's network card and the build
# network's NAT. iproute, util-linux-core (unshare, nsenter) and kmod
# (modprobe, for the NAT modules) serve pichi-build-netns.service.
# /usr/bin/conglobate,
# the units and the network files are installed by build.sh via
# mkosi.extra, not packages.

[Distribution]
Distribution=fedora
Release=43

[Output]
Format=disk
Output=conglobate
SplitArtifacts=partitions

[Content]
Bootable=no
Packages=
        filesystem
        systemd
        systemd-udev
        systemd-networkd
        iproute
        util-linux-core
        kmod
        kernel-core
        kernel-modules
        bash
        coreutils
        dnf
        glibc-minimal-langpack
        ca-certificates
        e2fsprogs
