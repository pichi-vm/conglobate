#
# Fedora 43 rootfs from packages (mkosi), not a layer on the fedora carapace.
# No RemoveFiles: stock fedora prunes modules this appliance must keep.
# kernel-modules is the virtiofs(+fuse) keep. Those modules stay in the
# carapace tree and are loaded after pivot; they are not initramfs pivot mods.
# e2fsprogs supplies image-resident mke2fs. /usr/bin/conglobate and the
# virtiofs units are installed by build.sh via mkosi.extra, not packages.

[Distribution]
Distribution=fedora
Release=43

[Output]
Format=disk
Output=conglobate
SplitArtifacts=partitions

[Content]
Bootable=no
Packages=
        filesystem
        systemd
        systemd-udev
        kernel-core
        kernel-modules
        bash
        coreutils
        dnf
        glibc-minimal-langpack
        ca-certificates
        e2fsprogs
