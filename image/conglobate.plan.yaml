#
# Skeleton only — self-host later via `pichi build`.
# Not the bootstrap builder. image/build.sh and mkosi.conf publish
# ghcr.io/pichi-vm/conglobate. This file is not used by that CI.
#
# Intended later product: an image whose PID 1 is systemd, that installs the
# units under .copr/systemd/, and that places `/usr/bin/conglobate` for the
# oneshot `conglobate appliance` service.

version: 1
stages:
  bootstrap:
    use: qualification.local/fedora:43
    format:
      size: 4GiB
      fs: ext4
      label: conglobate-build
    steps:
    - exec:
        command: |
          # Self-host later. Bootstrap CI does not execute this plan.
          true
        network: true
        timeout: 30m
  rootfs:
    extend: bootstrap
    steps:
    - copy:
        path: .copr/systemd
        into: /plan-input-units
    - exec:
        command: cp -a /plan-input-units/run-pichi-repo.mount /usr/lib/systemd/system/run-pichi-repo.mount
    - copy:
        path: .copr/systemd
        into: /plan-input-units
    - exec:
        command: cp -a /plan-input-units/run-pichi-cache.mount /usr/lib/systemd/system/run-pichi-cache.mount
    - copy:
        path: .copr/systemd
        into: /plan-input-units
    - exec:
        command: cp -a /plan-input-units/run-pichi-output.mount /usr/lib/systemd/system/run-pichi-output.mount
    - copy:
        path: .copr/systemd
        into: /plan-input-units
    - exec:
        command: cp -a /plan-input-units/conglobate-build.service
          /usr/lib/systemd/system/conglobate-build.service
    - exec:
        command: |
          systemctl enable run-pichi-repo.mount run-pichi-cache.mount run-pichi-output.mount
          systemctl enable conglobate-build.service
image: rootfs
