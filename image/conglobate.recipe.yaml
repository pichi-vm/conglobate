#
# Skeleton only — self-host later via `pichi build`.
# Not the bootstrap builder. image/build.sh and mkosi.conf publish
# ghcr.io/pichi-vm/conglobate. This file is not used by that CI.
#
# Intended later product: an image whose PID 1 is systemd, that installs the
# units under image/units/, and that places `/usr/bin/conglobate` for the
# oneshot `conglobate appliance` service.

bootstrap:
  # Placeholder locator — the bootstrap image is Fedora 43 from mkosi, not
  # this recipe. Replace only when self-host is actually wired.
  from: qualification.local/fedora:43
  filesystem: {type: ext4, size: 4GiB, properties: {label: conglobate-build}}
  derive:
    - network: true
      timeout: 30m
      run: |
        # Self-host later. Bootstrap CI does not execute this recipe.
        true
carapace:
  derive:
    - copy: {from: units/run-pichi-repo.mount, into: /usr/lib/systemd/system/run-pichi-repo.mount}
    - copy: {from: units/run-pichi-cache.mount, into: /usr/lib/systemd/system/run-pichi-cache.mount}
    - copy: {from: units/run-pichi-output.mount, into: /usr/lib/systemd/system/run-pichi-output.mount}
    - copy: {from: units/conglobate-build.service, into: /usr/lib/systemd/system/conglobate-build.service}
    - run: |
        systemctl enable run-pichi-repo.mount run-pichi-cache.mount run-pichi-output.mount
        systemctl enable conglobate-build.service
