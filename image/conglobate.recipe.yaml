#
# Skeleton only — fedora/carapace CI class shape for the build appliance.
# Not a publishable recipe: Follow-up A owns real rootfs contents, package
# set, and GHCR promotion. Self-host via `pichi build` is explicitly later.
#
# Intended product: an image whose PID 1 is systemd, that installs the units
# under image/units/, and that places `/usr/bin/conglobate` for the oneshot
# `conglobate appliance` service.

bootstrap:
  # Placeholder locator — replace when Follow-up A selects the real base.
  from: qualification.local/fedora:43
  filesystem: {type: ext4, size: 4GiB, properties: {label: conglobate-build}}
  derive:
    - network: true
      timeout: 30m
      run: |
        # Stub: install systemd, virtiofs.ko support, and the conglobate binary.
        # Real package and copy steps land in Follow-up A.
        true
carapace:
  derive:
    - copy: {from: units/run-pichi-repo.mount, into: /usr/lib/systemd/system/run-pichi-repo.mount}
    - copy: {from: units/run-pichi-cache.mount, into: /usr/lib/systemd/system/run-pichi-cache.mount}
    - copy: {from: units/run-pichi-output.mount, into: /usr/lib/systemd/system/run-pichi-output.mount}
    - copy: {from: units/conglobate-build.service, into: /usr/lib/systemd/system/conglobate-build.service}
    - run: |
        systemctl enable run-pichi-repo.mount run-pichi-cache.mount run-pichi-output.mount
        systemctl enable conglobate-build.service
