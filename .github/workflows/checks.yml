name: Rootless checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rootless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config zlib1g-dev
          rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run rootless tests
        run: cargo test --locked --all-targets
      - name: Run doctests
        run: cargo test --locked --doc

      - name: Check ORAS interoperability
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          cargo build --locked
          mkdir -p "$RUNNER_TEMP/oras"
          curl --fail --location --retry 3 https://github.com/oras-project/oras/releases/download/v1.3.5/oras_1.3.5_linux_amd64.tar.gz -o "$RUNNER_TEMP/oras/oras.tar.gz"
          printf 'f48a73ea6d026a862c3919fc773da9a8c86fc259c2c737d5baed3b8b9614ad22  %s\n' "$RUNNER_TEMP/oras/oras.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oras/oras.tar.gz" -C "$RUNNER_TEMP/oras" oras
          python3 tests/oci/run.py "$RUNNER_TEMP/oci-copy" --binary target/debug/conglobate --oras "$RUNNER_TEMP/oras/oras"

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check commit message
        run: pipx run --spec gitlint==0.19.1 gitlint --ignore-stdin --commit HEAD
      - name: Install dependency checkers
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo install --locked --version 0.19.9 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit
      - name: Check amd64 dependency policy
        run: cargo deny --locked --target x86_64-unknown-linux-gnu check licenses sources bans
      - name: Check arm64 dependency policy
        run: cargo deny --locked --target aarch64-unknown-linux-gnu check licenses sources bans
      - name: Check known advisories
        run: cargo audit
