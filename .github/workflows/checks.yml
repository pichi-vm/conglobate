name: Rootless checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rootless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config zlib1g-dev
          rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run rootless tests
        run: cargo test --locked --all-targets
      - name: Compile internal VM fixtures
        run: cargo check --locked --features test-fixtures --bin conglobate-lifecycle-tests

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        env:
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            commit_range="origin/$PR_BASE..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            commit_range="$PUSH_BEFORE..HEAD"
          else
            commit_range="HEAD^..HEAD"
          fi
          pipx run --spec gitlint==0.19.1 gitlint --commits "$commit_range"
      - name: Install dependency checkers
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo install --locked --version 0.19.9 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit
      - name: Check amd64 dependency policy
        run: cargo deny --locked --target x86_64-unknown-linux-gnu check licenses sources bans
      - name: Check arm64 dependency policy
        run: cargo deny --locked --target aarch64-unknown-linux-gnu check licenses sources bans
      - name: Check known advisories
        run: cargo audit

  image-stub:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate build-appliance image stub units
        run: ./image/check-stub.sh
