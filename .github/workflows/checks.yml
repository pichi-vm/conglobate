name: Rootless checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rootless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier-1 fail-fast (parallel with image-stub/lint/dependencies).
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: korandoru/hawkeye@v6

  # Cheap / fail-fast tier (parallel). Lifecycle and the appliance build
  # wait on this whole workflow via ci.yml, so a red lint or stub skips
  # those expensive jobs.
  image-stub:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate build-appliance image tree
        run: ./image/check-stub.sh

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config zlib1g-dev
          rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        env:
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # PR base / default branch may be missing when only the pushed tip
          # was checked out; fetch them so range resolution can fall back.
          base_ref="${PR_BASE:-main}"
          git fetch --no-tags origin "$base_ref"

          if [ -n "${PR_BASE}" ]; then
            commit_range="origin/${PR_BASE}..HEAD"
          elif [ -n "${PUSH_BEFORE}" ] \
            && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            commit_range="${PUSH_BEFORE}..HEAD"
          else
            # Force-push / new branch: before SHA is not in this clone.
            merge_base="$(git merge-base "origin/${base_ref}" HEAD)"
            commit_range="${merge_base}..HEAD"
          fi

          if [ "$(git rev-list --count "${commit_range}")" -eq 0 ]; then
            commit_range="HEAD^..HEAD"
          fi

          echo "gitlint commits: ${commit_range}"
          pipx run --spec gitlint==0.19.1 gitlint --commits "${commit_range}"
      - name: Check PR title leaves room for squash suffix
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Squash merges append " (#N)"; gitlint caps titles at 50 chars.
          squash_title="${PR_TITLE} (#${PR_NUMBER})"
          if [ "${#squash_title}" -gt 50 ]; then
            echo "::error::Squash title '${squash_title}' is" \
              "${#squash_title} chars (max 50); shorten the PR title."
            exit 1
          fi
          echo "Squash title OK (${#squash_title}/50): ${squash_title}"
      - name: Install dependency checkers
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo install --locked --version 0.19.9 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit
      - name: Check amd64 dependency policy
        run: cargo deny --locked --target x86_64-unknown-linux-gnu check licenses sources bans
      - name: Check arm64 dependency policy
        run: cargo deny --locked --target aarch64-unknown-linux-gnu check licenses sources bans
      - name: Check known advisories
        run: cargo audit
