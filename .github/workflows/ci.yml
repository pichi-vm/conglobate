name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: korandoru/hawkeye@v6

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pipx run gitlint --commits "origin/${{ github.base_ref || 'main' }}..HEAD"

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features

  test:
    name: build + test
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test

  privileged-tests:
    name: standalone privileged integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check out the pinned pichi consumer
        uses: actions/checkout@v4
        with:
          repository: pichi-vm/pichi
          ref: 3a5c409c703cccc5c5c29519896417f741a1383f
          path: .ci/pichi
      - name: Build pichi for the required OCI round trip
        working-directory: .ci/pichi
        run: |
          rustup toolchain install nightly-2026-07-06 --profile minimal
          cargo +nightly-2026-07-06 build --locked --bin pichi
      - name: Prepare kernel devices
        run: |
          sudo modprobe -a loop dm_snapshot dm_verity
          sudo udevadm settle
          test -e /dev/mapper/control
          test -e /dev/loop-control
      - name: Build integration tests
        run: cargo test --no-run --message-format=json > test-artifacts.json
      - name: Run privileged tests without a VM
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          pichi = Path(os.environ['GITHUB_WORKSPACE']) / '.ci/pichi/target/debug/pichi'
          assert pichi.is_file(), pichi
          with open('test-artifacts.json') as stream:
              for line in stream:
                  item = json.loads(line)
                  if item.get('reason') != 'compiler-artifact':
                      continue
                  executable = item.get('executable')
                  if executable and item.get('profile', {}).get('test'):
                      subprocess.run([
                          'sudo', 'env', f'PICHI_TEST_BINARY={pichi}',
                          'PICHI_REQUIRE_ROUNDTRIP=1',
                          'unshare', '--mount', '--propagation', 'private',
                          executable, '--ignored', '--test-threads=1',
                      ], check=True)
          PY
