name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: korandoru/hawkeye@v6

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pipx run gitlint --commits "origin/${{ github.base_ref || 'main' }}..HEAD"

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features

  test:
    name: build + test
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test

  privileged-tests:
    name: standalone privileged integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ORAS for the required OCI copy
        uses: oras-project/setup-oras@v2
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.5/oras_1.3.5_linux_amd64.tar.gz
          checksum: f48a73ea6d026a862c3919fc773da9a8c86fc259c2c737d5baed3b8b9614ad22
      - name: Prepare kernel devices
        run: |
          sudo modprobe -a loop dm_snapshot dm_verity
          sudo udevadm settle
          test -e /dev/mapper/control
          test -e /dev/loop-control
      - name: Build integration tests
        run: cargo test --no-run --message-format=json > test-artifacts.json
      - name: Run privileged tests without a VM
        run: |
          python3 - <<'PY'
          import json
          import shutil
          import subprocess
          oras = shutil.which('oras')
          assert oras is not None, 'ORAS must be installed'
          with open('test-artifacts.json') as stream:
              for line in stream:
                  item = json.loads(line)
                  if item.get('reason') != 'compiler-artifact':
                      continue
                  executable = item.get('executable')
                  if executable and item.get('profile', {}).get('test'):
                      subprocess.run([
                          'sudo', 'env', f'ORAS_TEST_BINARY={oras}',
                          'ORAS_REQUIRE_COPY=1',
                          'unshare', '--mount', '--propagation', 'private',
                          executable, '--ignored', '--test-threads=1',
                      ], check=True)
          PY
