name: Disposable VM lifecycle

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install trusted guest inputs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config zlib1g-dev qemu-system-x86 cpio zstd kmod linux-generic e2fsprogs acl attr libcap2-bin uidmap nftables iproute2 dmsetup strace
          rustup toolchain install 1.94.0 --profile minimal
      - name: Require KVM and select installed guest kernel
        run: |
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-conglobate-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm
          test -w /dev/kvm
          kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*-generic' | sort -V | tail -n 1)
          test -n "$kernel"
          sudo chmod a+r "$kernel"
          printf 'GUEST_KERNEL=%s\nGUEST_RELEASE=%s\n' "$kernel" "${kernel#/boot/vmlinuz-}" >> "$GITHUB_ENV"
      - name: Fetch locked build dependencies
        run: cargo fetch --locked --manifest-path tests/lifecycle/Cargo.toml
      - name: Run lifecycle cases in disposable guests
        run: |
          mkdir -p "$RUNNER_TEMP/lifecycle-results"
          for case in cache-storage contained runtime-scope clone-filter; do
            stat /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            python3 tests/lifecycle/run.py "$RUNNER_TEMP/lifecycle-results/$case" \
              --kernel "$GUEST_KERNEL" --kernel-release "$GUEST_RELEASE" \
              --module-root / --case "$case" --trace-mounts \
              > "$RUNNER_TEMP/lifecycle-results/$case.log" 2>&1
          done
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lifecycle-native-amd64
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lifecycle-results/*.log
            ${{ runner.temp }}/lifecycle-results/*/*.log
            ${{ runner.temp }}/lifecycle-results/*/*.json
            ${{ runner.temp }}/lifecycle-results/*/*.txt
            ${{ runner.temp }}/lifecycle-results/*/*.raw
            ${{ runner.temp }}/lifecycle-results/*/*.gz
            ${{ runner.temp }}/lifecycle-results/*/vmlinuz
