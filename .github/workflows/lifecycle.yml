name: Disposable VM lifecycle

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, qemu: qemu-system-x86}
          - {runner: ubuntu-24.04-arm, arch: arm64, qemu: qemu-system-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install trusted guest inputs
        run: |
          sudo apt-get update
          # Detached workspace subtree cloning needs newer mount API support
          # than Ubuntu's GA 6.8 kernel; retain failures rather than skip cases.
          # Select the HWE image directly: the meta-package also pulls physical
          # hardware firmware and headers that our disposable guest never uses.
          guest_image=$(apt-cache depends linux-image-generic-hwe-24.04 | awk '$1 == "Depends:" && $2 ~ /^linux-image-[0-9]/ {print $2}')
          [[ "$guest_image" =~ ^linux-image-[0-9][a-zA-Z0-9.+-]*-generic$ ]]
          sudo apt-get install --no-install-recommends -y build-essential pkg-config zlib1g-dev ${{ matrix.qemu }} cpio zstd kmod "$guest_image" e2fsprogs acl attr libcap2-bin uidmap nftables iproute2 dmsetup
          rustup toolchain install 1.94.0 --profile minimal
      - name: Select guest acceleration and installed kernel
        run: |
          # Arm hosted runners need not expose nested virtualization. TCG here
          # is a functional CI fixture, never a proposed production sandbox.
          accel=tcg
          if test -c /dev/kvm; then
            printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-conglobate-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            test -r /dev/kvm
            test -w /dev/kvm
            accel=kvm
          fi
          if test '${{ matrix.arch }}' = amd64; then test "$accel" = kvm; fi
          printf 'GUEST_ACCEL=%s\n' "$accel" >> "$GITHUB_ENV"
          kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*-generic' | sort -V | tail -n 1)
          test -n "$kernel"
          sudo chmod a+r "$kernel"
          printf 'GUEST_KERNEL=%s\nGUEST_RELEASE=%s\n' "$kernel" "${kernel#/boot/vmlinuz-}" >> "$GITHUB_ENV"
      - name: Fetch locked build dependencies
        run: cargo fetch --locked --manifest-path tests/lifecycle/Cargo.toml
      - name: Run lifecycle cases in disposable guests
        run: |
          mkdir -p "$RUNNER_TEMP/lifecycle-results"
          for case in cache-storage contained runtime-scope runtime-private-namespace runtime-changed-namespace clone-filter pty-filter; do
            python3 tests/lifecycle/run.py "$RUNNER_TEMP/lifecycle-results/$case" \
              --kernel "$GUEST_KERNEL" --kernel-release "$GUEST_RELEASE" \
              --module-root / --case "$case" --accel "$GUEST_ACCEL" \
              > "$RUNNER_TEMP/lifecycle-results/$case.log" 2>&1
          done
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lifecycle-native-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lifecycle-results/*.log
            ${{ runner.temp }}/lifecycle-results/*/*.log
            ${{ runner.temp }}/lifecycle-results/*/*.json
            ${{ runner.temp }}/lifecycle-results/*/*.txt
            ${{ runner.temp }}/lifecycle-results/*/*.raw
            ${{ runner.temp }}/lifecycle-results/*/*.gz
            ${{ runner.temp }}/lifecycle-results/*/vmlinuz
