name: build

on:
  workflow_call:
  workflow_dispatch:

env:
  # Crate version; unchanged by the producer migration.
  # Main pushes this tag and :latest. Pull requests do not push.
  CONGLOBATE_VERSION: "0.2.0"
  # Host tools and staged-image fixtures require nightly.
  NIGHTLY: "nightly-2026-07-06"
  BUILD_IMAGE: "ghcr.io/pichi-vm/conglobate@sha256:262f87ecd7a178a90979eebd9689a0a28c1a4d844e6572a0fea116bf782a0b6f"

jobs:
  # Validate alongside builds; publication requires both to succeed.
  checks:
    name: Rootless checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  # Qualify staged builds through the Fedora-based appliance on native KVM.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            firmware: x86_64-unknown-none
            runner: ubuntu-24.04
          - arch: arm64
            firmware: aarch64-unknown-none-softfloat
            runner: [ self-hosted, Linux, ARM64, bare-metal, aarch64, kvm ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Reserve build VM memory
        run: |
          if [ "${{ matrix.arch }}" = amd64 ]; then
            sudo chmod a+rw /dev/kvm
            sudo sysctl -w vm.nr_hugepages=4096
          fi
          test -r /dev/kvm && test -w /dev/kvm
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge 4096

      - name: Install the host toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal

      - name: Configure the image cache
        run: echo "XDG_DATA_HOME=$RUNNER_TEMP/appliance-image-cache" >> "$GITHUB_ENV"

      - name: Build Pichi
        working-directory: sources/pichi
        run: |
          cargo "+$NIGHTLY" build --locked --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Build Dillo
        working-directory: sources/dillo
        run: |
          cargo "+$NIGHTLY" --config packaging/cargo-config.toml build --locked --release
          echo "PICHI_DILLO=$PWD/target/release/dillo" >> "$GITHUB_ENV"

      - name: Pull the locked Fedora base
        run: |
          digest=$(sed -n 's/^  "ghcr.io\/pichi-vm\/fedora:43": //p' image/pichi.lock)
          pichi pull "ghcr.io/pichi-vm/fedora@$digest"

      - name: Build the appliance
        run: |
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "$CONGLOBATE_VERSION"
          pichi build . --ref HEAD --plan image/pichi.yaml --lock image/pichi.lock \
            --build-image "$BUILD_IMAGE" --memory 8192 \
            -t qualification.local/appliance:build

      - name: Export the appliance
        run: pichi save qualification.local/appliance:build -o "oci-${{ matrix.arch }}"

      - name: Install fixture targets
        run: >-
          rustup target add --toolchain "$NIGHTLY"
          "${{ matrix.firmware }}" "$(uname -m)-unknown-linux-musl"

      - name: Install fixture binutils
        if: matrix.arch == 'arm64'
        run: |
          tool_path=$(nix --extra-experimental-features 'nix-command flakes' build \
            github:NixOS/nixpkgs/08d3a97586f6b6343b3b5e799980773629432610#binutils \
            --no-link --print-out-paths)
          echo "$tool_path/bin" >> "$GITHUB_PATH"

      - name: Prepare the staged-image fixtures
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          target="$(uname -m)-unknown-linux-musl"
          cargo "+$NIGHTLY" install -Z bindeps --locked --git https://github.com/pichi-vm/arma \
            --rev 3297920b46122689fb13ca41acd61cbe94ac1de7 \
            --target "$target" --root "$RUNNER_TEMP/arma-guest" arma
          cargo "+$NIGHTLY" install --locked --git https://github.com/pichi-vm/corium \
            --rev c33ae0e01d58b657f8f62cb91672885326a903b9 \
            --target "$target" --root "$RUNNER_TEMP/corium-release" corium
          echo "PICHI_TEST_GUEST_ARMA=$RUNNER_TEMP/arma-guest/bin/arma" >> "$GITHUB_ENV"
          echo "PICHI_TEST_REPLACEMENT_CORIUM=$RUNNER_TEMP/corium-release/bin/corium" >> "$GITHUB_ENV"
          echo "PICHI_TEST_BUILD_IMAGE_LAYOUT=$GITHUB_WORKSPACE/oci-${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "PICHI_TEST_EVIDENCE=$RUNNER_TEMP/staged-image-evidence" >> "$GITHUB_ENV"

      - name: Qualify staged builds through the appliance
        working-directory: sources/pichi
        run: cargo "+$NIGHTLY" test --locked --release --features vm-tests --test staged_images -- --nocapture

      - name: Preserve appliance qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appliance-evidence-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/staged-image-evidence/**/*.log
            ${{ runner.temp }}/staged-image-evidence/**/manifest.json
            ${{ runner.temp }}/staged-image-evidence/**/root-sectors.json
            ${{ runner.temp }}/staged-image-evidence/**/bootconfig
            ${{ runner.temp }}/staged-image-evidence/**/pichi.yaml
            ${{ runner.temp }}/staged-image-evidence/**/pichi.lock
            ${{ runner.temp }}/staged-image-evidence/**/PASS
          include-hidden-files: true

      - name: Upload OCI layout artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-${{ matrix.arch }}
          path: oci-${{ matrix.arch }}

  # Load both OCI layouts, assemble one multi-arch index, and push :0.2.0
  # and :latest. Absent on pull requests and on non-main branches, so those
  # builds stay green without registry credentials.
  index:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pichi
        run: |
          git submodule update --init --recursive sources/pichi
          rustup toolchain install "$NIGHTLY" --profile minimal
          (cd sources/pichi && cargo "+$NIGHTLY" build --locked --release)
          echo "$GITHUB_WORKSPACE/sources/pichi/target/release" >> "$GITHUB_PATH"

      - name: Download OCI layout artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: oci-*

      - name: Authenticate to ghcr.io
        run: |
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)" \
            > "$HOME/.docker/config.json"

      - name: Load, assemble, and push the multi-arch index
        run: |
          # platform.os = pichi: a carapace is a pichi VM guest, not a
          # container "used on" an OS. Producer and `pichi pull` share this.
          # :0.2.0 is the durable pin; :latest is a moving alias.
          VERSION="${CONGLOBATE_VERSION}"
          pichi load "oci-amd64" --tag "conglobate:${VERSION}-amd64"
          pichi load "oci-arm64" --tag "conglobate:${VERSION}-arm64"
          list="conglobate:${VERSION}"
          pichi manifest create "$list" "${list}-amd64" "${list}-arm64" \
            -a "org.opencontainers.image.source=https://github.com/pichi-vm/conglobate" \
            -a "org.opencontainers.image.revision=${{ github.sha }}" \
            -a "org.opencontainers.image.version=${VERSION}" \
            -a "org.opencontainers.image.title=Conglobate ${VERSION}" \
            -a "org.opencontainers.image.description=Conglobate build appliance for pichi"
          pichi manifest annotate "$list" "${list}-amd64" --os pichi --arch amd64
          pichi manifest annotate "$list" "${list}-arm64" --os pichi --arch arm64
          pichi manifest push "$list" "ghcr.io/pichi-vm/conglobate:${VERSION}"
          pichi manifest push "$list" "ghcr.io/pichi-vm/conglobate:latest"
