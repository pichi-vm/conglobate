name: Rust tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config zlib1g-dev e2fsprogs dosfstools
          rustup toolchain install 1.94.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Run rootless tests
        run: cargo test --locked --features cli,git --all-targets
      - name: Run ignored tests as root
        run: |
          # The native bootconfig comparison runs in its packaged-tool job.
          sudo modprobe loop
          sudo modprobe dm_snapshot
          cargo --config 'target."cfg(unix)".runner = ["sudo", "-n"]' test --locked --features cli --all-targets -- --ignored --test-threads=1 --skip boot_config::tests

  bootconfig:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install packaged bootconfig and Rust tooling
        run: |
          dnf install -y cargo gcc git kernel-tools
          rpm -q cargo kernel-tools
      - uses: Swatinem/rust-cache@v2
      - name: Compare native boot configuration with Linux
        run: cargo test --locked --features cli --bin conglobate boot_config::tests -- --include-ignored
