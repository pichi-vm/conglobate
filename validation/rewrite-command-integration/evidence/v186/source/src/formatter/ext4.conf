[defaults]
    base_features = sparse_super,filetype,dir_index,has_journal,extent,huge_file,flex_bg,metadata_csum,64bit,dir_nlink,extra_isize
    blocksize = 4096
    inode_size = 256
    inode_ratio = 16384
    reserved_ratio = 0
    lazy_itable_init = false
    lazy_journal_init = false
    enable_periodic_fsck = false
    undo_dir = none
[fs_types]
    ext4 = {
        errors = remount-ro
    }
    conglobate = {
        inode_ratio = 16384
    }
